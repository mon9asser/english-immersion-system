
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 1 - Grammar Practice</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 16px;
    line-height: 1.6;
  }
  .question {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    margin: 16px 0;
  }
  .option {
    display: block;
    padding: 5px 0;
    cursor: pointer;
  }
  button {
    padding: 9px 15px;
    cursor: pointer;
    margin-top: 10px;
  }
  .result { font-weight: bold; }
  .correct { color: green; }
  .wrong { color: crimson; }
  .muted { color: #666; }
</style>
</head>
<body>
<h1>Story 1: The Unexpected Shortcut</h1>
<p>Grammar Practice — 50 Questions</p>
<p class="muted">Choose an answer and click Check Answer to see the feedback.</p>
<div id="quiz"></div>
<h2 id="score">Score: 0 / 50 checked</h2>
<button onclick="location.reload()">Restart Quiz</button>

<script>
const questions = [
  {
    q: "1. Mark _____ a list of errands yesterday.",
    options: ["has", "had", "have"],
    correct: 1,
    rule: "Past Simple"
  },
  {
    q: "2. I _____ my work last night.",
    options: ["finish", "have finished", "finished"],
    correct: 2,
    rule: "Past Simple"
  },
  {
    q: "3. At 8 PM yesterday, she _____ home.",
    options: ["was driving", "drove", "drives"],
    correct: 0,
    rule: "Past Continuous"
  },
  {
    q: "4. The rain _____ heavily when we left.",
    options: ["came", "was falling", "falls"],
    correct: 1,
    rule: "Past Continuous"
  },
  {
    q: "5. I _____ when the phone rang.",
    options: ["slept", "was sleeping", "am sleeping"],
    correct: 1,
    rule: "Past Continuous + Past Simple"
  },
  {
    q: "6. While he _____, his car hit a pothole.",
    options: ["was driving", "drives", "has driven"],
    correct: 0,
    rule: "Past Continuous + Past Simple"
  },
  {
    q: "7. She was tired because she _____ well the night before.",
    options: ["didn't sleep", "hasn't slept", "hadn't slept"],
    correct: 2,
    rule: "Past Perfect"
  },
  {
    q: "8. It was a road he _____ before.",
    options: ["never takes", "had never taken", "has never take"],
    correct: 1,
    rule: "Past Perfect"
  },
  {
    q: "9. He _____ the door and walked inside.",
    options: ["was opening", "opens", "opened"],
    correct: 2,
    rule: "Past Simple Sequence"
  },
  {
    q: "10. She picked up her bag, _____ the door, and left.",
    options: ["closed", "was closing", "had close"],
    correct: 0,
    rule: "Past Simple Sequence"
  },
  {
    q: "11. The sun _____, and birds were singing.",
    options: ["shines", "was shining", "shone tomorrow"],
    correct: 1,
    rule: "Past Continuous Background"
  },
  {
    q: "12. It _____ a gloomy morning.",
    options: ["were", "was", "is being"],
    correct: 1,
    rule: "Past Simple / Background Description"
  },
  {
    q: "13. I _____ finish this report today.",
    options: ["have to", "had to", "having to"],
    correct: 0,
    rule: "Have to"
  },
  {
    q: "14. Yesterday, he _____ pick up a birthday cake.",
    options: ["has to", "have to", "had to"],
    correct: 2,
    rule: "Had to"
  },
  {
    q: "15. Look at those dark clouds! It _____.",
    options: ["is going to rain", "going to rains", "will raining"],
    correct: 0,
    rule: "Be Going to"
  },
  {
    q: "16. I'm _____ study English tonight.",
    options: ["going", "going to", "go to"],
    correct: 1,
    rule: "Be Going to"
  },
  {
    q: "17. She decided _____ a shortcut.",
    options: ["taking", "take", "to take"],
    correct: 2,
    rule: "Decide + To-Infinitive"
  },
  {
    q: "18. I decided _____ JavaScript this year.",
    options: ["to learn", "learning", "learned"],
    correct: 0,
    rule: "Decide + To-Infinitive"
  },
  {
    q: "19. It started _____ heavily.",
    options: ["rained", "raining", "rain"],
    correct: 1,
    rule: "Start + Verb-ing"
  },
  {
    q: "20. He started _____ when he heard the joke.",
    options: ["to laugh", "laughed", "laughs"],
    correct: 0,
    rule: "Start + To-Infinitive"
  },
  {
    q: "21. I stayed home _____ it was raining.",
    options: ["because of", "because", "because the"],
    correct: 1,
    rule: "Because + Clause"
  },
  {
    q: "22. The match was canceled _____ the rain.",
    options: ["because", "because it", "because of"],
    correct: 2,
    rule: "Because of + Noun"
  },
  {
    q: "23. Choose the correct adjective + noun phrase.",
    options: ["a difficult problem", "a problem difficultly", "difficult a problem"],
    correct: 0,
    rule: "Adjective + Noun"
  },
  {
    q: "24. We walked along a _____ street.",
    options: ["narrow", "narrowly", "narrowness"],
    correct: 0,
    rule: "Adjective + Noun"
  },
  {
    q: "25. She spoke _____ so everyone could understand.",
    options: ["slow", "slowness", "slowly"],
    correct: 2,
    rule: "Adverb of Manner"
  },
  {
    q: "26. He drove _____ through the rain.",
    options: ["carefully", "careful", "care"],
    correct: 0,
    rule: "Adverb of Manner"
  },
  {
    q: "27. This is the book _____ I bought yesterday.",
    options: ["where", "that", "who"],
    correct: 1,
    rule: "Relative Clause"
  },
  {
    q: "28. The woman _____ called you is my manager.",
    options: ["which", "where", "who"],
    correct: 2,
    rule: "Relative Clause"
  },
  {
    q: "29. I _____ work late yesterday.",
    options: ["had to", "have to", "has to"],
    correct: 0,
    rule: "Have to vs. Had to"
  },
  {
    q: "30. I _____ attend a meeting tomorrow.",
    options: ["had to", "have to", "having to"],
    correct: 1,
    rule: "Have to vs. Had to"
  },
  {
    q: "31. The phone is ringing. I'll _____ it.",
    options: ["answer", "answered", "answering"],
    correct: 0,
    rule: "Will for Decisions"
  },
  {
    q: "32. Don't worry. I _____ help you with the project.",
    options: ["will", "am will", "will to"],
    correct: 0,
    rule: "Will for Promises"
  },
  {
    q: "33. _____ carefully to the instructions.",
    options: ["Listening", "Listen", "Listened"],
    correct: 1,
    rule: "Imperative"
  },
  {
    q: "34. _____ the story again to improve your understanding.",
    options: ["Read", "Reads", "Reading"],
    correct: 0,
    rule: "Imperative"
  },
  {
    q: "35. I try _____ English every day.",
    options: ["speaking", "to speak", "spoke"],
    correct: 1,
    rule: "Try + To-Infinitive"
  },
  {
    q: "36. He tried _____ the heavy door, but it wouldn't open.",
    options: ["to push", "pushed", "pushes"],
    correct: 0,
    rule: "Try + To-Infinitive"
  },
  {
    q: "37. She left without _____ goodbye.",
    options: ["say", "said", "saying"],
    correct: 2,
    rule: "Without + Verb-ing"
  },
  {
    q: "38. He solved the problem without _____ anyone for help.",
    options: ["asking", "ask", "asked"],
    correct: 0,
    rule: "Without + Verb-ing"
  },
  {
    q: "39. Sometimes you just _____ be patient.",
    options: ["has to", "have to", "having to"],
    correct: 1,
    rule: "Just Have to"
  },
  {
    q: "40. After the accident, she _____ call the police.",
    options: ["had to", "has to yesterday", "have to yesterday"],
    correct: 0,
    rule: "Have to / Had to"
  },
  {
    q: "41. It is important _____ every day.",
    options: ["practice", "practicing", "to practice"],
    correct: 2,
    rule: "It + Be + Adjective + To-Infinitive"
  },
  {
    q: "42. It was difficult _____ the map in the dark.",
    options: ["to read", "read", "reading it to"],
    correct: 0,
    rule: "It Was + Adjective + To-Infinitive"
  },
  {
    q: "43. _____ time do you need to finish?",
    options: ["How many", "How much", "How few"],
    correct: 1,
    rule: "How Much + Uncountable Noun"
  },
  {
    q: "44. How much _____ is left in the bottle?",
    options: ["water", "apples", "chairs"],
    correct: 0,
    rule: "How Much + Uncountable Noun"
  },
  {
    q: "45. I checked every single _____ before submitting the report.",
    options: ["pages", "page", "page's"],
    correct: 1,
    rule: "Every Single + Singular Noun"
  },
  {
    q: "46. She remembered every single _____ of the story.",
    options: ["details", "detail", "detailes"],
    correct: 1,
    rule: "Every Single + Singular Noun"
  },
  {
    q: "47. While I _____ dinner, my friend called.",
    options: ["was cooking", "cooked tomorrow", "am cooking yesterday"],
    correct: 0,
    rule: "Past Continuous + Past Simple"
  },
  {
    q: "48. By the time we arrived, the movie _____.",
    options: ["started", "has started", "had started"],
    correct: 2,
    rule: "Past Perfect"
  },
  {
    q: "49. The roads were wet _____ it had rained all night.",
    options: ["because", "because of", "because the"],
    correct: 0,
    rule: "Because + Clause"
  },
  {
    q: "50. He was late _____ the heavy traffic.",
    options: ["because", "because of", "because he"],
    correct: 1,
    rule: "Because of + Noun"
  }
];

const quiz = document.getElementById("quiz");
let checked = new Map();

questions.forEach((item, i) => {
  const section = document.createElement("section");
  section.className = "question";

  const title = document.createElement("h3");
  title.textContent = item.q;
  section.appendChild(title);

  const rule = document.createElement("p");
  rule.className = "muted";
  rule.textContent = "Grammar: " + item.rule;
  section.appendChild(rule);

  item.options.forEach((option, j) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "q" + i;
    radio.value = j;

    label.appendChild(radio);
    label.appendChild(document.createTextNode(" " + option));
    section.appendChild(label);
  });

  const button = document.createElement("button");
  button.textContent = "Check Answer";

  const result = document.createElement("p");
  result.className = "result";
  result.setAttribute("aria-live", "polite");

  button.addEventListener("click", () => {
    const selected = section.querySelector('input[name="q' + i + '"]:checked');

    if (!selected) {
      result.textContent = "Please select an answer first.";
      result.className = "result";
      return;
    }

    const isCorrect = Number(selected.value) === item.correct;
    checked.set(i, isCorrect);

    result.textContent = isCorrect
      ? "Correct! ✓ " + item.options[item.correct]
      : "Not quite. Correct answer: " + item.options[item.correct];

    result.className = "result " + (isCorrect ? "correct" : "wrong");
    document.getElementById("score").textContent =
      "Score: " + [...checked.values()].filter(Boolean).length +
      " / " + checked.size + " checked";
  });

  section.appendChild(button);
  section.appendChild(result);
  quiz.appendChild(section);
});
</script>
</body>
</html>
