
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story 1: The Unexpected Shortcut</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 0 16px; line-height: 1.6; }
    .question { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    label { display: block; margin: 8px 0; cursor: pointer; }
    button { padding: 9px 16px; cursor: pointer; margin-top: 10px; }
    .result { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Story 1: The Unexpected Shortcut</h1>
  <p>Choose an answer, then click Check Answer.</p>
  <div id="quiz"></div>
  <p id="score"></p>

  <script>
    const questions = [
      {
        q: "You missed your train and don't know what to do. You're...",
        options: ["in a pickle", "rolling with the punches", "stuck in traffic"],
        correct: 0
      },
      {
        q: "Your plans suddenly change, but you stay calm and adapt. You...",
        options: ["are in a jam", "roll with the punches", "are not a car in sight"],
        correct: 1
      },
      {
        q: "You missed the bus, then it started raining. You say...",
        options: ["This is just my luck!", "I'm rolling with traffic!", "I'm in sight!"],
        correct: 0
      },
      {
        q: "The road is crowded, and your car barely moves. You're...",
        options: ["in a pickle", "stuck in traffic", "out of luck in sight"],
        correct: 1
      },
      {
        q: "There are absolutely no cars visible. There is...",
        options: ["not another soul in sight", "not a car in sight", "a car in a pickle"],
        correct: 1
      },

      {
        q: "You have a problem and need help. You're...",
        options: ["in a jam", "in sight", "rolling in traffic"],
        correct: 0
      },
      {
        q: "Your flight is canceled, but you stay calm and adjust your plans. You...",
        options: ["get stuck in traffic", "roll with the punches", "are in sight"],
        correct: 1
      },
      {
        q: "You forgot your homework at home. You say...",
        options: ["This is just my luck!", "Not a car in sight!", "Roll with traffic!"],
        correct: 0
      },
      {
        q: "You're late because the highway is full of cars. You're...",
        options: ["in a pickle", "stuck in traffic", "rolling with the punches"],
        correct: 1
      },
      {
        q: "You look down an empty road. There is...",
        options: ["a jam in sight", "not a car in sight", "a pickle in traffic"],
        correct: 1
      },
      {
        q: "You made a mistake and need to solve the problem. You need to...",
        options: ["get out of the situation", "roll in the situation", "be a car in sight"],
        correct: 0
      },
      {
        q: "Your computer crashes right before a deadline. You're...",
        options: ["in a pickle", "not a car in sight", "stuck in traffic"],
        correct: 0
      },
      {
        q: "Your plans change unexpectedly, but you deal with it calmly. You...",
        options: ["are stuck in traffic", "roll with the punches", "are in a car"],
        correct: 1
      },
      {
        q: "You spill coffee on your shirt before an interview. You say...",
        options: ["This is just my luck!", "I'm not a car in sight!", "I'm rolling with traffic!"],
        correct: 0
      },
      {
        q: "You can't move because traffic is very heavy. You're...",
        options: ["in a jam with your keys", "stuck in traffic", "rolling with the punches"],
        correct: 1
      },
      {
        q: "You have no money to pay the bill and don't know what to do. You're...",
        options: ["in a pickle", "not a car in sight", "rolling in traffic"],
        correct: 0
      },
      {
        q: "You need to find a solution to a difficult problem. You need to...",
        options: ["get out of the situation", "be stuck in sight", "roll with traffic"],
        correct: 0
      },
      {
        q: "You arrive on an empty road with no vehicles around. There is...",
        options: ["a pickle in sight", "not a car in sight", "a jam in traffic"],
        correct: 1
      },
      {
        q: "Your train is delayed, but you remain flexible and patient. You...",
        options: ["roll with the punches", "are not a car in sight", "are stuck in a pickle"],
        correct: 0
      },
      {
        q: "You lose your wallet on the day you need it most. You say...",
        options: ["This is just my luck!", "I'm not a car in sight!", "I'm rolling with traffic!"],
        correct: 0
      }
    ];

    const quiz = document.getElementById("quiz");

    questions.forEach((item, i) => {
      const section = document.createElement("section");
      section.className = "question";
      section.innerHTML = `<h3>${i + 1}. ${item.q}</h3>`;

      item.options.forEach((option, j) => {
        const label = document.createElement("label");
        label.innerHTML = `
          <input type="radio" name="q${i}" value="${j}">
          ${option}
        `;
        section.appendChild(label);
      });

      const button = document.createElement("button");
      button.textContent = "Check Answer";

      const result = document.createElement("p");
      result.className = "result";
      result.setAttribute("aria-live", "polite");

      button.onclick = () => {
        const selected = section.querySelector(`input[name="q${i}"]:checked`);

        if (!selected) {
          result.textContent = "Please select an answer first.";
          result.style.color = "darkorange";
          return;
        }

        const isCorrect = Number(selected.value) === item.correct;
        result.textContent = isCorrect
          ? `Correct! ✓ ${item.options[item.correct]}`
          : `Not quite. The correct answer is: ${item.options[item.correct]}`;

        result.style.color = isCorrect ? "green" : "crimson";
      };

      section.appendChild(button);
      section.appendChild(result);
      quiz.appendChild(section);
    });
  </script>
</body>
</html>
